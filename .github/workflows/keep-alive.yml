name: Keep Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier cold start
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping mathitout health endpoint
        run: |
          curl -sf -m 30 https://mathlearn-wuda.onrender.com/api/health || echo "ping failed but service will warm up on next real visit"
