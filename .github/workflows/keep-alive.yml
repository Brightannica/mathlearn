name: Keep Alive

on:
  schedule:
    # Runs every 5 minutes to prevent Render free-tier cold start
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping mathitout health endpoint
        run: |
          for i in 1 2 3; do
            echo "ping attempt $i..."
            code=$(curl -sf -m 50 -o /dev/null -w "%{http_code}" https://mathlearn-wuda.onrender.com/api/health || echo "000")
            echo "status: $code"
            if [ "$code" = "200" ]; then
              echo "ok"
              exit 0
            fi
            sleep 5
          done
          echo "all attempts failed, but the next scheduled run will retry"
          exit 0
