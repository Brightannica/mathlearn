name: Keep Alive Primary

on:
  schedule:
    # Every 4 minutes to prevent Render free-tier cold start
    - cron: "*/4 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm up the service
        run: |
          echo "pinging service at $(date)"
          for i in 1 2 3; do
            code=$(curl -sf -m 55 -o /dev/null -w "%{http_code}" "https://mathlearn-wuda.onrender.com/api/health" || echo "000")
            echo "attempt $i: status $code"
            if [ "$code" = "200" ]; then
              echo "service is up"
              exit 0
            fi
            sleep 3
          done
          echo "will retry on next run"
