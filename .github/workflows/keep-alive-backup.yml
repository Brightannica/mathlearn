name: Keep Alive Backup

on:
  schedule:
    # Offset by 2.5 minutes from the primary cron to close any gaps
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping mathitout health endpoint (backup)
        run: |
          for i in 1 2 3; do
            code=$(curl -sf -m 50 -o /dev/null -w "%{http_code}" https://mathlearn-wuda.onrender.com/api/health || echo "000")
            echo "backup ping $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 0
