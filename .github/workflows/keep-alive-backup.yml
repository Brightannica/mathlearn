name: Keep Alive Backup

on:
  schedule:
    # Offset by 2 minutes from primary for redundancy
    - cron: "2,6,10,14,18,22,26,30,34,38,42,46,50,54,58 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Backup ping
        run: |
          echo "backup ping at $(date)"
          curl -sf -m 55 -o /dev/null "https://mathlearn-wuda.onrender.com/api/health" || true
          echo "done"
