<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mathitout — warming up</title>
  <meta http-equiv="refresh" content="10" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fafafa;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .wrap {
      max-width: 28rem;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 1rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }
    p {
      color: #71717a;
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .card {
      border: 1px solid #27272a;
      background: #0d0d0d;
      padding: 1rem;
      text-align: left;
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .card-title {
      color: #52525b;
      margin-bottom: 0.5rem;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin: 0.25rem 0;
    }
    .row span:first-child { color: #a1a1aa; }
    .row span:last-child { color: #c4f000; }
    .bar {
      height: 4px;
      background: #18181b;
      margin-top: 0.75rem;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #c4f000;
      width: 0%;
      transition: width 0.3s;
    }
    .btn {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      border: 1px solid #27272a;
      color: #fafafa;
      text-decoration: none;
      font-size: 0.75rem;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover {
      border-color: #c4f000;
      color: #c4f000;
    }
    .btn-primary {
      background: #c4f000;
      color: #0a0a0a;
      border-color: #c4f000;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #b3d800;
      color: #0a0a0a;
    }
    .tip {
      color: #3f3f46;
      font-size: 10px;
      margin-top: 1.5rem;
    }
    .success {
      color: #c4f000;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><div class="dot" id="dot"></div><span id="status">// warming up</span></div>
    <h1 id="title">spinning up the service</h1>
    <p id="desc">
      free-tier render puts the server to sleep after 15 minutes idle.
      the first visit wakes it up — usually 20–50 seconds.
      this page is auto-retrying.
    </p>

    <div class="card">
      <div class="card-title">// status</div>
      <div class="row"><span>service</span><span>render free</span></div>
      <div class="row"><span>spin-down</span><span>15 min idle</span></div>
      <div class="row"><span>checking</span><span id="attempt">0</span></div>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
    </div>

    <div style="display: flex; gap: 0.5rem; justify-content: center;">
      <button class="btn btn-primary" id="retryBtn" onclick="check()">↻ checking...</button>
    </div>

    <div class="tip">
      keep this tab open to avoid cold starts entirely
    </div>
  </div>

  <script>
    const TARGET = "https://mathlearn-wuda.onrender.com/api/health";
    const APP = "https://mathlearn-wuda.onrender.com";
    let attempts = 0;
    let checking = false;

    async function check() {
      if (checking) return;
      checking = true;
      attempts++;
      document.getElementById("attempt").textContent = attempts;

      const btn = document.getElementById("retryBtn");
      btn.textContent = "↻ checking...";
      btn.disabled = true;

      try {
        const ctrl = new AbortController();
        const timeout = setTimeout(() => ctrl.abort(), 15000);
        const res = await fetch(TARGET, {
          signal: ctrl.signal,
          cache: "no-store",
          mode: "cors"
        });
        clearTimeout(timeout);

        if (res.ok) {
          document.getElementById("status").textContent = "// ready";
          document.getElementById("status").className = "badge success";
          document.getElementById("title").textContent = "service is up";
          document.getElementById("desc").textContent = "redirecting to mathitout...";
          document.getElementById("bar").style.width = "100%";
          btn.textContent = "→ continue";
          btn.onclick = () => { window.location.href = APP; };
          setTimeout(() => { window.location.href = APP; }, 500);
          return;
        }
      } catch (e) {
        // still warming up
      }

      checking = false;
      btn.textContent = "↻ retry now";
      btn.disabled = false;

      // animate progress bar based on attempt count
      const pct = Math.min(10 + attempts * 12, 90);
      document.getElementById("bar").style.width = pct + "%";
    }

    // Check every 5 seconds
    check();
    setInterval(check, 5000);
  </script>
</body>
</html>
